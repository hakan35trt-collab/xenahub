    <!-- SEO -->
    <title>MOD CLUB</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XENAHUB - Türkiye'nin Yayıncı Platformu" />
    <meta name="twitter:description" content="Türkiye'nin en büyük yayıncı ve oyun topluluğu." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

        <script>
      (function() {
        try {
          var raw = localStorage.getItem('xenahub_admin_pwa');
          if (!raw) return;
          var pwa = JSON.parse(raw);
          if (pwa.name) document.title = pwa.name;
          if (pwa.name) document.querySelector('meta[name="application-name"]')?.setAttribute('content', pwa.name);
          if (pwa.shortName) document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content', pwa.shortName);
          if (pwa.themeColor) document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){ m.setAttribute('content', pwa.themeColor); });
          if (pwa.icon) {
            var apple = document.querySelector('link[rel="apple-touch-icon"]') || document.createElement('link');
            apple.setAttribute('rel', 'apple-touch-icon');
            apple.setAttribute('href', pwa.icon);
            if (!apple.parentNode) document.head.appendChild(apple);
            var icon = document.querySelector('link[rel="icon"]') || document.createElement('link');
            icon.setAttribute('rel', 'icon');
            icon.setAttribute('href', pwa.icon);
            if (!icon.parentNode) document.head.appendChild(icon);
          }
        } catch(e) {}
      })();
    </script>
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Service Worker Registration (global, before React) -->
    <script>
      (function() {
        // Capture PWA install prompt BEFORE React loads
        window.__deferredPrompt = null;
        window.__pwaInstallable = false;
        window.__pwaInstalled = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPrompt = e;
          window.__pwaInstallable = true;
          console.log('[PWA] Install prompt captured');
          // Dispatch custom event for React to detect
          window.dispatchEvent(new CustomEvent('pwa:installable'));
        });

        window.addEventListener('appinstalled', function() {
          window.__pwaInstalled = true;
          window.__pwaInstallable = false;
          window.__deferredPrompt = null;
          console.log('[PWA] App installed');
          window.dispatchEvent(new CustomEvent('pwa:installed'));
        });

        // Register service worker
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              console.log('[SW] Registered');
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(new CustomEvent('sw:update'));
                  }
                });
              });
            }).catch(function(err) {
              console.log('[SW] Registration failed:', err);
            });
          });
        }
      })();
    </script>

    <style>
      /* Critical CSS */
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { background: #0a0a0f; color: #fff; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
      #splash { position: fixed; inset: 0; z-index: 9999; background: #0a0a0f; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.6s ease; }
      #splash-brand { font-size: 2.5rem; font-weight: 900; letter-spacing: 0.15em; }
      #splash-dots { display: flex; gap: 6px; margin-top: 16px; }
      @keyframes splashBounce { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-8px); opacity: 1; } }
      #splash-dots span { width: 8px; height: 8px; border-radius: 50%; background: #9147ff; animation: splashBounce 0.6s ease infinite; }
      #splash-dots span:nth-child(2) { animation-delay: 0.1s; background: #bf94ff; }
      #splash-dots span:nth-child(3) { animation-delay: 0.2s; background: #FFD700; }
    </style>

  <body>
    <div id="splash">
      <div id="splash-brand"><span style="color:#fff">MOD</span><span style="color:#9147ff">CLUB</span></div>
      <div id="splash-dots"><span></span><span></span><span></span></div>
    </div>
