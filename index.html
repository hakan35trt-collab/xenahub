<!DOCTYPE html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: light)" />
    <meta name="background-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XENAHUB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="XENAHUB" />
    <meta name="msapplication-TileColor" content="#9147ff" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="google" content="notranslate" />

    <!-- SEO -->
    <title>XENAHUB - Türkiye'nin Yayıncı Platformu</title>
    <meta name="description" content="XENAHUB - Türkiye'nin en büyük yayıncı ve oyun topluluğu. Canlı yayınlar, etkinlikler, turnuvalar ve çok daha fazlası." />
    <meta name="keywords" content="xenahub, yayıncı, twitch, youtube, gaming, esports, turnuva, canlı yayın" />
    <meta name="author" content="XENAHUB" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="XENAHUB - Türkiye'nin Yayıncı Platformu" />
    <meta property="og:description" content="Türkiye'nin en büyük yayıncı ve oyun topluluğu." />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:url" content="https://xenahub.app" />
    <meta property="og:site_name" content="XENAHUB" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XENAHUB - Türkiye'nin Yayıncı Platformu" />
    <meta name="twitter:description" content="Türkiye'nin en büyük yayıncı ve oyun topluluğu." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="mask-icon" href="/icons/icon-512x512.png" color="#9147ff" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Critical CSS */
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { background: #0a0a0f; color: #fff; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
      #splash { position: fixed; inset: 0; z-index: 9999; background: #0a0a0f; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.6s ease; }
      #splash-brand { font-size: 2.5rem; font-weight: 900; letter-spacing: 0.15em; }
      #splash-dots { display: flex; gap: 6px; margin-top: 16px; }
      @keyframes splashBounce { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-8px); opacity: 1; } }
      #splash-dots span { width: 8px; height: 8px; border-radius: 50%; background: #9147ff; animation: splashBounce 0.6s ease infinite; }
      #splash-dots span:nth-child(2) { animation-delay: 0.1s; background: #bf94ff; }
      #splash-dots span:nth-child(3) { animation-delay: 0.2s; background: #FFD700; }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-brand"><span style="color:#fff">MOD</span><span style="color:#9147ff">CLUB</span></div>
      <div id="splash-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/client/main.tsx"></script>
    <noscript>Bu uygulama JavaScript gerektirir.</noscript>
  </body>
</html>
